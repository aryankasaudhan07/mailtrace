<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg:#fbf9f4; --card:#fff; --card-2:#f3efe7; --line:#ece7dc;
    --text:#1b1811; --text-2:#6a6455; --text-3:#9a927f;
    --accent:#0e7a57; --accent-dim:rgba(14,122,87,.10);
    --crit:#d8433d;
  }
  * { box-sizing:border-box; }
  body { margin:0; width:340px; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); }
  .head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .badge { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:#fff;
    background:linear-gradient(135deg,#18a774,#0e7a57); font-weight:800; }
  .title { font-weight:700; font-size:14px; letter-spacing:-.2px; }
  .sub { font-size:11px; color:var(--text-3); }
  .body { padding:14px 16px; }
  label { display:block; font-size:12px; color:var(--text-2); margin:10px 0 4px; }
  input[type=email], input[type=password], input[type=text] {
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card);
    font-size:13px; color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  .btn { width:100%; margin-top:12px; padding:10px; border:none; border-radius:9px; background:var(--accent);
    color:#fff; font-weight:600; font-size:13px; cursor:pointer; }
  .btn:hover { filter:brightness(1.06); }
  .btn.sm { width:auto; padding:6px 12px; font-size:12px; margin:0; }
  .btn.ghost { background:var(--card-2); color:var(--text-2); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .muted { color:var(--text-2); font-size:12px; }
  .dim { color:var(--text-3); font-size:11px; }
  .err { background:rgba(216,67,61,.10); color:var(--crit); font-size:12px; padding:8px 10px; border-radius:8px; margin-top:10px; }
  .adv { font-size:11px; color:var(--accent); cursor:pointer; margin-top:10px; display:inline-block; }
  .switch { position:relative; width:38px; height:22px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--line); border-radius:22px; transition:.15s; cursor:pointer; }
  .slider::before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider::before { transform:translateX(16px); }
  .list { margin-top:6px; max-height:280px; overflow-y:auto; }
  .item { padding:10px 0; border-top:1px solid var(--line); }
  .item .s { font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .to { color:var(--text-3); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; margin-top:4px; }
  .stat.open { color:var(--accent); }
  .stat.unopen { color:var(--text-3); }
  .empty { text-align:center; color:var(--text-3); font-size:12px; padding:22px 0; }
  .sec-title { font-size:12px; font-weight:700; color:var(--text-2); }
  hr.d { border:none; border-top:1px solid var(--line); margin:14px 0; }
</style>
</head>
<body>
  <div class="head">
    <div class="badge">M</div>
    <div><div class="title">Mailtrace</div><div class="sub">Gmail Read Receipts</div></div>
  </div>
  <div class="body" id="app"><div class="empty">Loading…</div></div>
  <script src="popup.js"></script>
</body>
</html>
