<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg:#fbf9f4; --card:#fff; --card-2:#f4f1ea; --line:#eae5da; --line-2:#dfd8c9;
    --text:#1b1811; --text-2:#5f5949; --text-3:#9a927f;
    --accent:#0e7a57; --accent-2:#18a774; --accent-dim:rgba(14,122,87,.10);
    --crit:#c0392b; --crit-bg:#fdeceb;
    --high:#c2610c; --high-bg:#fdf1e4;
    --susp:#a17f0a; --susp-bg:#fbf5e2;
    --ok:#0e7a57;   --ok-bg:#eaf6f1;
    --radius:11px;
  }
  * { box-sizing:border-box; }
  body { margin:0; width:372px; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:13px; }
  button { font-family:inherit; }

  /* ---- header ---- */
  .head { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--card);
    border-bottom:1px solid var(--line); }
  .logo { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none;
    background:linear-gradient(140deg,var(--accent-2),var(--accent)); box-shadow:0 2px 8px rgba(14,122,87,.28); }
  .title { font-weight:700; font-size:14px; letter-spacing:-.2px; line-height:1.15; }
  .sub { font-size:11px; color:var(--text-3); line-height:1.3; }
  .head .spacer { margin-left:auto; }
  .iconbtn { width:28px; height:28px; border-radius:8px; border:1px solid transparent; background:transparent;
    display:grid; place-items:center; cursor:pointer; color:var(--text-3); }
  .iconbtn:hover { background:var(--card-2); color:var(--text-2); }
  .iconbtn.on { background:var(--accent-dim); color:var(--accent); }

  /* ---- tabs ---- */
  .tabs { display:flex; gap:4px; padding:0 14px; background:var(--card); border-bottom:1px solid var(--line); }
  .tab { padding:9px 10px; font-size:12px; font-weight:600; color:var(--text-3); cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab:hover { color:var(--text-2); }
  .tab.on { color:var(--accent); border-bottom-color:var(--accent); }

  .body { padding:12px 14px 14px; }

  /* ---- summary strip ---- */
  .summary { display:flex; gap:7px; margin-bottom:11px; }
  .sbox { flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:8px 9px; text-align:center; }
  .sbox .n { font-size:18px; font-weight:800; letter-spacing:-.5px; line-height:1.1; }
  .sbox .l { font-size:10px; color:var(--text-3); margin-top:2px; font-weight:600; letter-spacing:.2px; }
  .sbox.crit .n { color:var(--crit); } .sbox.high .n { color:var(--high); } .sbox.ok .n { color:var(--ok); }

  .statusline { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-3);
    margin-bottom:10px; min-width:0; }
  .statusline .acct { margin-left:auto; max-width:160px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; flex:none; }
  .live { width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }
  .live.off { background:var(--text-3); }

  /* ---- result cards ---- */
  .list { display:flex; flex-direction:column; gap:8px; max-height:330px; overflow-y:auto; margin:0 -2px; padding:0 2px; }
  .item { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--line-2);
    border-radius:var(--radius); padding:10px 11px; }
  .item.crit { border-left-color:var(--crit); } .item.high { border-left-color:var(--high); }
  .item.susp { border-left-color:var(--susp); } .item.ok { border-left-color:var(--ok); }
  .item .s { font-weight:650; font-size:13px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .from { color:var(--text-3); font-size:11px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { display:flex; align-items:center; gap:7px; margin-top:8px; flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px;
    font-size:10.5px; font-weight:700; letter-spacing:.2px; }
  .pill.crit { color:var(--crit); background:var(--crit-bg); } .pill.high { color:var(--high); background:var(--high-bg); }
  .pill.susp { color:var(--susp); background:var(--susp-bg); } .pill.ok { color:var(--ok); background:var(--ok-bg); }
  .dot { width:6px; height:6px; border-radius:50%; flex:none; background:currentColor; }
  .when { font-size:10.5px; color:var(--text-3); margin-left:auto; }
  .why { color:var(--text-2); font-size:11.5px; margin-top:7px; line-height:1.5; }
  .why b { font-weight:650; color:var(--text); }
  .note { color:var(--text-3); font-size:10.5px; margin-top:5px; line-height:1.45; }

  /* ---- forms / buttons ---- */
  label.f { display:block; font-size:11.5px; color:var(--text-2); margin:10px 0 4px; font-weight:600; }
  input[type=email], input[type=password], input[type=text] {
    width:100%; padding:10px 11px; border:1px solid var(--line-2); border-radius:9px; background:var(--card);
    font-size:13px; color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  select { padding:5px 8px; border:1px solid var(--line-2); border-radius:8px; background:var(--card);
    font-size:11.5px; color:var(--text); }
  .btn { width:100%; padding:11px; border:none; border-radius:9px; background:var(--accent);
    color:#fff; font-weight:650; font-size:13px; cursor:pointer; }
  .btn:hover:not(:disabled) { background:var(--accent-2); }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn.sm { width:auto; padding:6px 11px; font-size:11.5px; }
  .btn.ghost { background:var(--card-2); color:var(--text-2); border:1px solid var(--line); }
  .btn.ghost:hover:not(:disabled) { background:var(--line); }

  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sec { font-size:11px; font-weight:700; color:var(--text-3); letter-spacing:.5px; text-transform:uppercase; }
  .muted { color:var(--text-2); font-size:12px; }
  .dim { color:var(--text-3); font-size:11px; line-height:1.5; }
  .err { background:var(--crit-bg); color:var(--crit); font-size:11.5px; padding:9px 10px; border-radius:9px;
    margin-top:10px; line-height:1.5; }
  .warn { background:var(--susp-bg); color:#7c6410; font-size:11.5px; padding:9px 10px; border-radius:9px;
    margin-top:10px; line-height:1.5; }
  .empty { text-align:center; color:var(--text-3); font-size:12px; padding:26px 14px; line-height:1.65;
    background:var(--card); border:1px dashed var(--line-2); border-radius:var(--radius); }
  .empty b { color:var(--text-2); }

  /* ---- settings drawer ---- */
  .panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 12px; margin-bottom:11px; }
  .panel .row + .row { margin-top:10px; }
  .switch { position:relative; width:36px; height:21px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--line-2); border-radius:21px; transition:.15s; cursor:pointer; }
  .slider::before { content:""; position:absolute; width:15px; height:15px; left:3px; top:3px; background:#fff;
    border-radius:50%; transition:.15s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider::before { transform:translateX(15px); }
  .link { font-size:11px; color:var(--accent); cursor:pointer; font-weight:600; }
  .link:hover { text-decoration:underline; }
  .link.danger { color:var(--crit); }
  .hr { border:none; border-top:1px solid var(--line); margin:11px 0; }

  /* ---- connect / trust ---- */
  .hero { text-align:center; padding:6px 0 2px; }
  .hero .ic { width:46px; height:46px; border-radius:13px; margin:0 auto 10px; display:grid; place-items:center;
    background:var(--accent-dim); color:var(--accent); }
  .hero h2 { margin:0 0 5px; font-size:15px; font-weight:750; letter-spacing:-.2px; }
  .hero p { margin:0; font-size:12px; color:var(--text-2); line-height:1.55; }
  .trust { margin:12px 0 0; padding:0; list-style:none; }
  .trust li { display:flex; gap:8px; align-items:flex-start; font-size:11.5px; color:var(--text-2);
    line-height:1.5; padding:6px 0; }
  .trust svg { flex:none; margin-top:1px; color:var(--accent); }
  /* ---- read-receipts view ---- */
  .sec-title { font-size:11px; font-weight:700; color:var(--text-3); letter-spacing:.5px; text-transform:uppercase; }
  hr.d { border:none; border-top:1px solid var(--line); margin:11px 0; }
  .item .to { color:var(--text-3); font-size:11px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:650; margin-top:6px; }
  .stat.open { color:var(--accent); }
  .stat.unopen { color:var(--text-3); }
  .adv { font-size:11px; color:var(--accent); cursor:pointer; font-weight:600; }
  .adv:hover { text-decoration:underline; }
  a { color:var(--accent); }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3"
        stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M2.5 6.5 12 13l9.5-6.5"/></svg>
    </div>
    <div>
      <div class="title">Mailtrace</div>
      <div class="sub" id="headsub">Email threat intelligence</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="gear" title="Settings" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="tabs" id="tabs" style="display:none">
    <div class="tab on" data-tab="inbox">Inbox risk</div>
    <div class="tab" data-tab="sent">Read receipts</div>
  </div>
  <div class="body" id="app"><div class="empty">Loading…</div></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
