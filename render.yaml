# Render blueprint — deploys Mailtrace as one Docker web service that serves
# both the API and the React UI. Push this repo to GitHub, then in Render:
#   New +  →  Blueprint  →  pick this repo  →  Apply.
# After the first deploy, set the secret env vars in the dashboard (optional).
services:
  - type: web
    name: mailtrace
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FIXTURE_MODE
        value: "1"
      # Optional live extras — set these in the Render dashboard, not in git:
      - key: GEMINI_API_KEY
        sync: false
      - key: ABUSEIPDB_KEY
        sync: false
      # OTP email. RECOMMENDED on Render: Brevo HTTP API (Render free tier blocks
      # outbound SMTP ports, so SMTP cannot work here). Set BREVO_API_KEY + a
      # Brevo-verified sender in MAIL_FROM. Leave unset to keep the demo fallback.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # SMTP is a fallback for hosts that allow outbound SMTP (not Render free).
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
