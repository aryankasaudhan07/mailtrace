# One command for the whole stack: docker compose up --build
# Then: http://localhost:8000/docs

services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - .:/srv
      - ./intel:/srv/intel:ro   # offline geo/ASN/Tor/VPN databases
    depends_on: [db, cache]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file: [.env]
    volumes:
      - .:/srv
      - ./intel:/srv/intel:ro
    depends_on: [db, cache]
    # TODO-A phase 4: enable once Celery tasks exist.
    command: ["sh", "-c", "echo 'worker idle until phase 4' && sleep infinity"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailtrace
      POSTGRES_PASSWORD: mailtrace
      POSTGRES_DB: mailtrace
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailtrace"]
      interval: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
